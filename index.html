<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kaizora Origins</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;

            font-family: Arial, sans-serif;

            background: #080a0f;
            color: white;
        }

        .contenido {
            padding: 40px;
        }

        h1 {
            font-size: 70px;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }

        h1 span {
            color: #8b5cf6;
        }

        p {
            color: #a1a1aa;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="contenido">

        <h1>
            KAIZORA <span>ORIGINS</span>
        </h1>

        <p>
            Tu historia comienza aquí.
        </p>

    </div>

</body>
</html>
